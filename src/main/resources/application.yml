spring:
  application:
    name: teetarApp
  datasource:
    url: jdbc:postgresql://localhost:5433/tdb
    username: tuser
    password: tuser
    driver-class-name: org.postgresql.Driver
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    show-sql: true
    hibernate:
      ddl-auto: update
server:
  port: 8080
